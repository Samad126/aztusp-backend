# Fixed project name so volumes/containers can't collide with other stacks on the server
name: aztusp-backend

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aztusp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aztusp}
      POSTGRES_DB: aztusp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aztusp"]
      interval: 3s
      retries: 10

  api:
    build: .
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"  # put a reverse proxy in front
    env_file: .env
    environment:
      DATABASE_URL: postgresql://aztusp:${POSTGRES_PASSWORD:-aztusp}@db:5432/aztusp
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
