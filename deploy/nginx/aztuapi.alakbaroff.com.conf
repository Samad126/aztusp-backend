# /etc/nginx/conf.d/aztuapi.alakbaroff.com.conf
#
#   aztuapi.alakbaroff.com -> backend (127.0.0.1:3003)
#
# Uses the same certificate as converter.alakbaroff.com (live/alakbaroff.com).
#
# The frontend is on a different origin, so CORS is needed. It is set by the
# application, not here: nginx appends rather than replaces headers, so an
# add_header Access-Control-Allow-Origin at this level would send it twice
# and browsers reject that.

server {
    listen 80;
    listen [::]:80;
    server_name aztuapi.alakbaroff.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aztuapi.alakbaroff.com;

    ssl_certificate     /etc/letsencrypt/live/alakbaroff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alakbaroff.com/privkey.pem;

    # Profile photos can be up to 10 MB (MAX_PHOTO_BYTES in app/photos.py). nginx's default is 1 MB, which would
    # refuse larger photos with its own HTML 413 before the app sees them.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scraping the university site can be slow; give the app room to
        # answer with its own error rather than a bare 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    access_log /var/log/nginx/aztuapi.alakbaroff.com.access.log;
    error_log  /var/log/nginx/aztuapi.alakbaroff.com.error.log;
}
