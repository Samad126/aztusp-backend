# /etc/nginx/conf.d/aztu.alakbaroff.com.conf
#   aztu.alakbaroff.com     -> frontend (127.0.0.1:3004)
#   aztuapi.alakbaroff.com  -> backend  (127.0.0.1:3003)

server {
    listen 80;
    listen [::]:80;
    server_name aztu.alakbaroff.com aztuapi.alakbaroff.com;
    return 301 https://$host$request_uri;
}

# Frontend
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aztu.alakbaroff.com;

    ssl_certificate     /etc/letsencrypt/live/aztu.alakbaroff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aztu.alakbaroff.com/privkey.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}

# Backend API (scraping can be slow, hence the longer read timeout)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aztuapi.alakbaroff.com;

    ssl_certificate     /etc/letsencrypt/live/aztuapi.alakbaroff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aztuapi.alakbaroff.com/privkey.pem;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }
}
