# /etc/nginx/conf.d/aztu.alakbaroff.com.conf
#
#   aztu.alakbaroff.com     -> frontend (127.0.0.1:3004)
#   aztuapi.alakbaroff.com  -> backend  (127.0.0.1:3003)
#
# One certificate covers both names; issue it before enabling this file:
#   sudo certbot certonly --nginx -d aztu.alakbaroff.com -d aztuapi.alakbaroff.com

# ---------------------------------------------------------------------
# Plain HTTP: send everything to HTTPS.
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name aztu.alakbaroff.com aztuapi.alakbaroff.com;

    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------
# Frontend
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aztu.alakbaroff.com;

    ssl_certificate     /etc/letsencrypt/live/aztu.alakbaroff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aztu.alakbaroff.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    access_log /var/log/nginx/aztu.alakbaroff.com.access.log;
    error_log  /var/log/nginx/aztu.alakbaroff.com.error.log;
}

# ---------------------------------------------------------------------
# Backend API
#
# The frontend is on a different origin, so CORS is needed. It is set by the
# application, not here: nginx appends rather than replaces headers, so an
# add_header Access-Control-Allow-Origin at this level would send it twice
# and browsers reject that.
# ---------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aztuapi.alakbaroff.com;

    ssl_certificate     /etc/letsencrypt/live/aztu.alakbaroff.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aztu.alakbaroff.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Scraping the university site can be slow; give the app room to
        # answer with its own error rather than a bare 504.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    access_log /var/log/nginx/aztuapi.alakbaroff.com.access.log;
    error_log  /var/log/nginx/aztuapi.alakbaroff.com.error.log;
}
